version: '3.9'

volumes:
   # Solo mantenemos volúmenes para datos que no necesitamos versionar
   geo-db-data:
   ldap_data:
   ldap_config:

services:
   # PostgreSQL + PostGIS (configuración de Kartoza)
   db:
      image: kartoza/postgis:${POSTGIS_VERSION_TAG:-16-3.4}
      container_name: plugineta-postgis
      volumes:
        - geo-db-data:/var/lib/postgresql
        - ./docker/init-db:/docker-entrypoint-initdb.d
      ports:
        - "${POSTGRES_PORT:-5432}:5432"
      environment:
        - POSTGRES_DB=${POSTGRES_DB:-gis_database}
        - POSTGRES_USER=${POSTGRES_USER:-gis_user}
        - POSTGRES_PASS=${POSTGRES_PASS:-gis_password}
        - ALLOW_IP_RANGE=${ALLOW_IP_RANGE:-0.0.0.0/0}
        - FORCE_SSL=FALSE
      restart: on-failure
      healthcheck:
        test: "PGPASSWORD=$${POSTGRES_PASS} pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 30s

   # OpenLDAP Server
   ldap:
      image: osixia/openldap:1.5.0
      container_name: plugineta-ldap
      environment:
        LDAP_ORGANISATION: "Plugineta Organization"
        LDAP_DOMAIN: "plugineta.local"
        LDAP_ADMIN_PASSWORD: "admin_password"
        LDAP_CONFIG_PASSWORD: "config_password"
        LDAP_READONLY_USER: "true"
        LDAP_READONLY_USER_USERNAME: "readonly"
        LDAP_READONLY_USER_PASSWORD: "readonly_password"
        LDAP_RFC2307BIS_SCHEMA: "false"
        LDAP_BACKEND: "mdb"
        LDAP_TLS: "false"
        LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
      ports:
        - "389:389"
        - "636:636"
      volumes:
        - ldap_data:/var/lib/ldap
        - ldap_config:/etc/ldap/slapd.d
        - ./docker/ldap-init:/container/service/slapd/assets/config/bootstrap/ldif/custom
      command: --copy-service
      restart: on-failure
      healthcheck:
        test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b dc=plugineta,dc=local -D 'cn=admin,dc=plugineta,dc=local' -w admin_password"]
        interval: 30s
        timeout: 5s
        retries: 3

   # phpLDAPadmin - Web UI para administrar LDAP
   ldap-admin:
      image: osixia/phpldapadmin:0.9.0
      container_name: plugineta-ldap-admin
      environment:
        PHPLDAPADMIN_LDAP_HOSTS: "ldap"
        PHPLDAPADMIN_HTTPS: "false"
      ports:
        - "8081:80"
      depends_on:
        - ldap
      restart: on-failure

   # GeoServer (configuración de Kartoza)
   geoserver:
      #image: kartoza/geoserver:${GS_VERSION:-2.25.1}
      image: docker.osgeo.org/geoserver:2.28.0
      
      #image: kartoza/geoserver:latest
      container_name: plugineta-geoserver
      volumes:
        # Usar directorios locales para versionar configuración
        #- ./server/geoserver/data_dir:/opt/geoserver/data_dir
        - ./server/geoserver/data_dir:/opt/geoserver_data
        - ./server/geoserver/gwc:/opt/geoserver/gwc
        - ./server/geoserver/settings:/settings
        # PluginetaGeoserverExt: extensión nativa de GeoServer (plan de migración de plataforma, Fase 1)
        - ./geomvd/PluginetaGeoserverExt/target/PluginetaGeoserverExt-1.0.0-SNAPSHOT.jar:/usr/local/tomcat/webapps/geoserver/WEB-INF/lib/PluginetaGeoserverExt.jar
        # GeoMvdCoreAPI: dependencia compile de la extensión, no se empaqueta dentro de su jar (hay que desplegarla aparte)
        - ./geomvd/GeoMvdCoreAPI/target/GeoMvdCoreAPI-1.1.0-SNAPSHOT.jar:/usr/local/tomcat/webapps/geoserver/WEB-INF/lib/GeoMvdCoreAPI.jar
        # gson: dependencia de GeoMvdCoreAPI que GeoServer no trae bundleada (ver Fase 0 del plan: log4j y org.json sí vienen ya, gson no)
        - ./geomvd/PluginetaGeoserverExt/target/webapp-lib/gson-2.8.5.jar:/usr/local/tomcat/webapps/geoserver/WEB-INF/lib/gson-2.8.5.jar
      ports:
        - "${GEOSERVER_PORT:-8080}:8080"
      restart: on-failure
      environment:
#        - GEOSERVER_DATA_DIR=${GEOSERVER_DATA_DIR:-/opt/geoserver/data_dir}
        - SKIP_DEMO_DATA=true
        - GEOWEBCACHE_CACHE_DIR=${GEOWEBCACHE_CACHE_DIR:-/opt/geoserver/gwc}
        - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD:-geoserver}
        - GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER:-admin}
        - INITIAL_MEMORY=${INITIAL_MEMORY:-2G}
        - MAXIMUM_MEMORY=${MAXIMUM_MEMORY:-4G}
        - STABLE_EXTENSIONS=${STABLE_EXTENSIONS:-wps,csw,inspire,importer}
        - COMMUNITY_EXTENSIONS=${COMMUNITY_EXTENSIONS:-}
        - GEOSERVER_CONTEXT_ROOT=${GEOSERVER_CONTEXT_ROOT:-geoserver}
        - ROOT_WEBAPP_REDIRECT=true
        - CONSOLE_HANDLER_LEVEL=${CONSOLE_HANDLER_LEVEL:-WARNING}
        # URL que GeoServer usa para autoreferenciarse en capabilities documents, redirecciones de
        # login, etc. (application property nativa de GeoServer, no es un invento de esta imagen).
        # Sin esto, detrás de un tunnel (ngrok/Cloudflare) GeoServer sigue creyendo que es
        # http://localhost:8080 y las redirecciones de login/enlaces internos rompen. Reusa
        # PLUGINETA_PUBLIC_URL (la misma variable que ya hornea el plugin QGIS - ver
        # plugin-repo-publisher abajo) para que un solo valor alcance para las dos cosas. Vacía =
        # cae al comportamiento de siempre (localhost, uso local sin tunnel).
        - PROXY_BASE_URL=${PLUGINETA_PUBLIC_URL:-http://localhost:${GEOSERVER_PORT:-8080}}/${GEOSERVER_CONTEXT_ROOT:-geoserver}
        # El panel web de administración (Wicket) de GeoServer tiene proteccion CSRF que valida
        # que el Origin/Referer del request coincida con un host conocido - detras de un tunnel
        # (dominio distinto a localhost) esto bloquea acciones AJAX del admin (ej. editar reglas
        # en Data Security) con "400 Bad Request" / "Origin does not correspond to request". Ver
        # https://docs.geoserver.org/stable/en/user/security/webadmin/csrf.html. Whitelist por
        # sufijo de dominio (no hace falta el host completo del tunel, cubre cualquier subdominio
        # aleatorio de trycloudflare.com/ngrok-free.app sin tener que actualizarlo por sesion).
        - GEOSERVER_CSRF_WHITELIST=${GEOSERVER_CSRF_WHITELIST:-trycloudflare.com,ngrok-free.app}
        # Configuración de base de datos PostgreSQL
        - POSTGRES_DB=${POSTGRES_DB:-gis_database}
        - POSTGRES_USER=${POSTGRES_USER:-gis_user}
        - POSTGRES_PASS=${POSTGRES_PASS:-gis_password}
        - POSTGRES_HOST=db
        - POSTGRES_PORT=5432
        # JNDI DataSource nativo de esta imagen de GeoServer (server.xml ya trae un <Resource>
        # templateado con estas variables — ver plan de migración de plataforma, Fase 2).
        # Usa nombres de variable distintos a los de arriba (USERNAME/PASSWORD, no USER/PASS).
        - POSTGRES_JNDI_RESOURCE_NAME=jboss/datasources/pluginetaDS
        - POSTGRES_USERNAME=${POSTGRES_USER:-gis_user}
        - POSTGRES_PASSWORD=${POSTGRES_PASS:-gis_password}

      depends_on:
        db:
          condition: service_healthy
        ldap:
          condition: service_healthy
      healthcheck:
        test: [ "CMD-SHELL", "curl --fail --silent --write-out 'HTTP CODE : %{http_code}\n' --output /dev/null -u $${GEOSERVER_ADMIN_USER}:$${GEOSERVER_ADMIN_PASSWORD} http://localhost:8080/$${GEOSERVER_CONTEXT_ROOT}/rest/about/version.xml" ]
        interval: 5m
        timeout: 30s
        retries: 5
        start_period: 2m

   # Cloudflare Tunnel - expone GeoServer (y por lo tanto el repo de plugins embebido) a
   # internet con HTTPS, sin abrir puertos ni tener dominio propio. Reemplaza a ngrok: el free
   # tier de ngrok interpone una pagina HTML de confirmacion ("interstitial") ante cualquier
   # visitante sin el header ngrok-skip-browser-warning, lo cual traba tanto al instalador de
   # QGIS (que baja plugins.xml/im_layer_loader.zip con un cliente HTTP simple, no un navegador)
   # como al propio plugin corriendo. Un "quick tunnel" de Cloudflare no tiene ese problema y no
   # requiere cuenta ni login - a cambio, la URL es efimera (cambia en cada arranque).
   # Uso:
   #   docker compose --profile tunnel up -d cloudflared
   #   docker compose logs cloudflared | grep trycloudflare.com   # imprime la URL asignada
   # Con esa URL: setear PLUGINETA_PUBLIC_URL en .env y luego
   #   docker compose up -d geoserver                             # aplica PROXY_BASE_URL
   #   docker compose --profile publish up plugin-repo-publisher  # hornea el plugin con esa URL
   cloudflared:
      profiles: ["tunnel"]
      image: cloudflare/cloudflared:latest
      container_name: plugineta-cloudflared
      command: tunnel --no-autoupdate --url http://geoserver:8080
      depends_on:
        - geoserver
      restart: on-failure

   # Publica/actualiza el plugin QGIS que sirve el repositorio embebido en GeoServer
   # (PluginetaRepoController, /rest/plugineta/repo/**) - opcionalmente con un host publico
   # (ngrok, Cloudflare Tunnel) horneado en su config, via PLUGINETA_PUBLIC_URL en .env. Corre
   # una vez y termina (no es un servicio de larga duracion), no bloquea el resto del stack, y
   # no hace falta reiniciar geoserver despues (el controller lee el zip del disco en cada
   # request). Ver code/frontend/publish-plugin-repo.sh. Se dispara a demanda:
   #   docker compose --profile publish up plugin-repo-publisher
   plugin-repo-publisher:
      profiles: ["publish"]
      image: alpine:3.20
      container_name: plugineta-plugin-repo-publisher
      environment:
        - PLUGINETA_PUBLIC_URL=${PLUGINETA_PUBLIC_URL:-}
        - PLUGIN_REPO_OUTPUT_DIR=/output
      volumes:
        - ./code/frontend:/frontend:ro
        - ./server/geoserver/data_dir/plugineta-config/plugin-repo:/output
      working_dir: /frontend
      entrypoint: ["/bin/sh", "-c"]
      command:
        - "apk add --no-cache bash zip >/dev/null && bash publish-plugin-repo.sh"
      restart: "no"

   # WildFly Application Server (Backend Java)
   wildfly:
      # Dormida por defecto tras la migración de plataforma (Fase 4): ya no hace falta para que
      # el plugin funcione (ver geomvd/PluginetaGeoserverExt). Sigue completa y sin tocar por si
      # hace falta compararla o volver atrás — se levanta a demanda con:
      #   docker compose --profile legacy up wildfly
      profiles: ["legacy"]
      build:
        context: ./server/wildfly-docker
        dockerfile: Dockerfile
      image: plugineta-wildfly:10.1.0
      container_name: plugineta-wildfly
      ports:
        - "8082:8080"   # HTTP (8082 en host para no conflictuar con GeoServer)
        - "9990:9990"   # Management console
        - "8787:8787"   # Debug ports
      environment:
        # Configuración de conexión a PostgreSQL
        - DB_HOST=db
        - DB_PORT=5432
        - DB_NAME=${POSTGRES_DB:-gis_database}
        - DB_USER=${POSTGRES_USER:-gis_user}
        - DB_PASSWORD=${POSTGRES_PASS:-gis_password}
        - DEBUG_FLAGS=--debug 8787
      volumes:
        # Directorio para deployments (WAR files)
        - ./server/wildfly/deployments:/opt/wildfly/standalone/deployments
        # Solo mapear el directorio de apps (no toda la configuración)
        - ./server/wildfly/configuration/apps:/opt/wildfly/standalone/configuration/apps
        # Logs persistentes
        - ./server/wildfly/log:/opt/wildfly/standalone/log
      depends_on:
        db:
          condition: service_healthy
      restart: on-failure
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 60s
