version: '3.9'

volumes:
   # Solo mantenemos volúmenes para datos que no necesitamos versionar
   geo-db-data:
   ldap_data:
   ldap_config:

services:
   # PostgreSQL + PostGIS (configuración de Kartoza)
   db:
      image: kartoza/postgis:${POSTGIS_VERSION_TAG:-16-3.4}
      container_name: plugineta-postgis
      volumes:
        - geo-db-data:/var/lib/postgresql
        - ./docker/init-db:/docker-entrypoint-initdb.d
      ports:
        - "${POSTGRES_PORT:-5432}:5432"
      environment:
        - POSTGRES_DB=${POSTGRES_DB:-gis_database}
        - POSTGRES_USER=${POSTGRES_USER:-gis_user}
        - POSTGRES_PASS=${POSTGRES_PASS:-gis_password}
        - ALLOW_IP_RANGE=${ALLOW_IP_RANGE:-0.0.0.0/0}
        - FORCE_SSL=FALSE
      restart: on-failure
      healthcheck:
        test: "PGPASSWORD=$${POSTGRES_PASS} pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 30s

   # OpenLDAP Server
   ldap:
      image: osixia/openldap:1.5.0
      container_name: plugineta-ldap
      environment:
        LDAP_ORGANISATION: "Plugineta Organization"
        LDAP_DOMAIN: "plugineta.local"
        LDAP_ADMIN_PASSWORD: "admin_password"
        LDAP_CONFIG_PASSWORD: "config_password"
        LDAP_READONLY_USER: "true"
        LDAP_READONLY_USER_USERNAME: "readonly"
        LDAP_READONLY_USER_PASSWORD: "readonly_password"
        LDAP_RFC2307BIS_SCHEMA: "false"
        LDAP_BACKEND: "mdb"
        LDAP_TLS: "false"
        LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
      ports:
        - "389:389"
        - "636:636"
      volumes:
        - ldap_data:/var/lib/ldap
        - ldap_config:/etc/ldap/slapd.d
        - ./docker/ldap-init:/container/service/slapd/assets/config/bootstrap/ldif/custom
      command: --copy-service
      restart: on-failure
      healthcheck:
        test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b dc=plugineta,dc=local -D 'cn=admin,dc=plugineta,dc=local' -w admin_password"]
        interval: 30s
        timeout: 5s
        retries: 3

   # phpLDAPadmin - Web UI para administrar LDAP
   ldap-admin:
      image: osixia/phpldapadmin:0.9.0
      container_name: plugineta-ldap-admin
      environment:
        PHPLDAPADMIN_LDAP_HOSTS: "ldap"
        PHPLDAPADMIN_HTTPS: "false"
      ports:
        - "8081:80"
      depends_on:
        - ldap
      restart: on-failure

   # GeoServer (configuración de Kartoza)
   geoserver:
      #image: kartoza/geoserver:${GS_VERSION:-2.25.1}
      image: docker.osgeo.org/geoserver:2.28.0
      
      #image: kartoza/geoserver:latest
      container_name: plugineta-geoserver
      volumes:
        # Usar directorios locales para versionar configuración
        #- ./server/geoserver/data_dir:/opt/geoserver/data_dir
        - ./server/geoserver/data_dir:/opt/geoserver_data
        - ./server/geoserver/gwc:/opt/geoserver/gwc
        - ./server/geoserver/settings:/settings
      ports:
        - "${GEOSERVER_PORT:-8080}:8080"
      restart: on-failure
      environment:
#        - GEOSERVER_DATA_DIR=${GEOSERVER_DATA_DIR:-/opt/geoserver/data_dir}
        - SKIP_DEMO_DATA=true
        - GEOWEBCACHE_CACHE_DIR=${GEOWEBCACHE_CACHE_DIR:-/opt/geoserver/gwc}
        - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD:-geoserver}
        - GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER:-admin}
        - INITIAL_MEMORY=${INITIAL_MEMORY:-2G}
        - MAXIMUM_MEMORY=${MAXIMUM_MEMORY:-4G}
        - STABLE_EXTENSIONS=${STABLE_EXTENSIONS:-wps,csw,inspire,importer}
        - COMMUNITY_EXTENSIONS=${COMMUNITY_EXTENSIONS:-}
        - GEOSERVER_CONTEXT_ROOT=${GEOSERVER_CONTEXT_ROOT:-geoserver}
        - ROOT_WEBAPP_REDIRECT=true
        - CONSOLE_HANDLER_LEVEL=${CONSOLE_HANDLER_LEVEL:-WARNING}
        # Configuración de base de datos PostgreSQL
        - POSTGRES_DB=${POSTGRES_DB:-gis_database}
        - POSTGRES_USER=${POSTGRES_USER:-gis_user}
        - POSTGRES_PASS=${POSTGRES_PASS:-gis_password}
        - POSTGRES_HOST=db
        - POSTGRES_PORT=5432
        
      depends_on:
        db:
          condition: service_healthy
        ldap:
          condition: service_healthy
      healthcheck:
        test: [ "CMD-SHELL", "curl --fail --silent --write-out 'HTTP CODE : %{http_code}\n' --output /dev/null -u $${GEOSERVER_ADMIN_USER}:$${GEOSERVER_ADMIN_PASSWORD} http://localhost:8080/$${GEOSERVER_CONTEXT_ROOT}/rest/about/version.xml" ]
        interval: 5m
        timeout: 30s
        retries: 5
        start_period: 2m

   # WildFly Application Server (Backend Java)
   wildfly:
      build:
        context: ./server/wildfly-docker
        dockerfile: Dockerfile
      image: plugineta-wildfly:10.1.0
      container_name: plugineta-wildfly
      ports:
        - "8082:8080"   # HTTP (8082 en host para no conflictuar con GeoServer)
        - "9990:9990"   # Management console
      environment:
        # Configuración de conexión a PostgreSQL
        - DB_HOST=db
        - DB_PORT=5432
        - DB_NAME=${POSTGRES_DB:-gis_database}
        - DB_USER=${POSTGRES_USER:-gis_user}
        - DB_PASSWORD=${POSTGRES_PASS:-gis_password}
      volumes:
        # Directorio para deployments (WAR files)
        - ./server/wildfly/deployments:/opt/wildfly/standalone/deployments
        # Solo mapear el directorio de apps (no toda la configuración)
        - ./server/wildfly/configuration/apps:/opt/wildfly/standalone/configuration/apps
        # Logs persistentes
        - ./server/wildfly/log:/opt/wildfly/standalone/log
      depends_on:
        db:
          condition: service_healthy
      restart: on-failure
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 60s
