# Metadata del repositorio de plugins QGIS servido por PluginetaRepoController.
# Para publicar una version nueva: reemplazar im_layer_loader.zip en este directorio y
# actualizar "version" aca (no hace falta recompilar ni reiniciar GeoServer).
#
# IMPORTANTE: fileName NO debe tener un "." antes de ".zip" (nada de "-0.65.zip"). El
# instalador de QGIS, al instalar desde un repositorio, calcula el id interno del plugin
# cortando fileName en el PRIMER punto (fileName.partition(".")[0]) - con un nombre como
# "im_layer_loader-0.65.zip" el primer punto cae en "0.65", no antes de "zip", y QGIS
# termina esperando una carpeta "im_layer_loader-0" que no existe (el zip trae
# "im_layer_loader/", que es el nombre real del modulo Python). Error resultante:
# "El complemento ha desaparecido... la carpeta .../im_layer_loader-0 no fue encontrada".
fileName=im_layer_loader.zip
name=Open Plugineta
version=0.71
qgisMinimumVersion=3.0
description=Plugin para cargar y gestionar capas geoespaciales
about=Plugin para cargar y gestionar capas geoespaciales desde un servidor GeoServer con autenticacion LDAP.
author=Open Plugineta
homepage=https://github.com/yonsonsal/elre
tracker=https://github.com/yonsonsal/elre/issues
experimental=False
deprecated=False
