
#URL GEOSERVER (accessible from host machine)
URLgeoserver=http://localhost:8080/geoserver
URLcore=http://localhost:8082/geomvd-app/api/core/

#datasources conexion DB
#Nota: en WildFly esto era "jboss/datasources/pluginetaDS" (lookup sin prefijo resuelto
#contra el namespace global de WildFly). En Tomcat (GeoServer), un lookup sin "java:" se
#resuelve relativo a la raiz "java:", por eso hace falta el prefijo "comp/env/" para llegar
#al recurso declarado en META-INF/context.xml (que Tomcat expone bajo java:comp/env/...).
#Ver plan de migracion de plataforma, Fase 2.
pluginetaDS=java:comp/env/jboss/datasources/pluginetaDS

#tipo de medición: lineal = false - geodésica = true
geodesicMeasure=true

#CRS por defecto para workspaces que no declaren epsg explicito en su .ori (plan multi-CRS)
defaultEpsg=32721

#url Manual
URLmanual=https://s1.q4cdn.com/806093406/files/doc_downloads/test.pdf
